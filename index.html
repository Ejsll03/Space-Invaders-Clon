<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Space Invaders</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
</head>
<body>
    <div id="container">
        <h1>Space Invaders</h1>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Controles táctiles (visibles solo en dispositivos touch) -->
    <div id="touch-controls">
        <div class="dpad">
            <div class="dpad-btn dpad-up"    data-key="KeyW">&#9650;</div>
            <div class="dpad-btn dpad-left"  data-key="KeyA">&#9664;</div>
            <div class="dpad-btn dpad-right" data-key="KeyD">&#9654;</div>
            <div class="dpad-btn dpad-down"  data-key="KeyS">&#9660;</div>
        </div>
        <div class="action-btns">
            <div class="action-btn btn-shoot" id="btn-shoot">FIRE</div>
            <div class="action-btn btn-pause" id="btn-pause">II</div>
        </div>
    </div>
</body>
</html>
